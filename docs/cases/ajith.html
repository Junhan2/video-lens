<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Motion Reel 2026 (recreation)</title>
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #111113; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #111113; }
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
  .abs { position: absolute; left: 0; top: 0; }
  .disp { font-family: "Avenir Next", "Avenir", sans-serif; font-weight: 800; white-space: pre; }
  .din { font-family: "DIN Alternate", "DIN Condensed", sans-serif; font-weight: 700; white-space: pre; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
// Every animation below is a Web Animations API animation that spans the whole clip (duration T) and starts at
// page load; procedural parts (particles, letters on arcs) are pre-computed at each 60 fps frame time.
const T = 15.2, TD = T * 1000, FPS = 60, CX = 960, CY = 540;
const ALL = [];
const stage = document.getElementById('stage');

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
function bez(x1, y1, x2, y2) {
  const f = (u, a, b) => 3 * a * u * (1 - u) * (1 - u) + 3 * b * u * u * (1 - u) + u * u * u;
  return (p) => {
    if (p <= 0) return 0;
    if (p >= 1) return 1;
    let lo = 0, hi = 1;
    for (let i = 0; i < 40; i++) { const u = (lo + hi) / 2; if (f(u, x1, x2) < p) lo = u; else hi = u; }
    return f((lo + hi) / 2, y1, y2);
  };
}
const E = {
  lin: (p) => p,
  out: bez(0.22, 1, 0.36, 1),
  inOut: bez(0.65, 0, 0.35, 1),
  in: bez(0.55, 0, 1, 0.45),
  outBack: (p) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
};
// Piecewise value: pts = [[t, v, easeIntoThisPoint], ...]
function pw(t, pts) {
  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (t <= pts[i][0]) {
      const [t0, v0] = pts[i - 1], [t1, v1, e] = pts[i];
      return lerp(v0, v1, (e || E.lin)((t - t0) / (t1 - t0)));
    }
  }
  return pts[pts.length - 1][1];
}
const pwLog = (t, pts) => Math.exp(pw(t, pts.map(([a, v, e]) => [a, Math.log(v), e])));
const mixHex = (a, b, p) => {
  const c = (h, i) => parseInt(h.slice(1 + 2 * i, 3 + 2 * i), 16);
  return `rgb(${[0, 1, 2].map((i) => Math.round(lerp(c(a, i), c(b, i), p))).join(',')})`;
};

function el(tag, css, parent, html) {
  const e = document.createElement(tag);
  if (css) e.style.cssText = css;
  if (html != null) e.innerHTML = html;
  (parent || stage).appendChild(e);
  return e;
}
// kfs: [{t, ...props, e: easing}] in clip seconds; held before the first and after the last keyframe.
function anim(target, kfs) {
  const k = kfs.map((o) => {
    const r = { ...o, offset: clamp(o.t / T, 0, 1) };
    delete r.t; delete r.e;
    if (o.e) r.easing = o.e;
    return r;
  });
  if (k[0].offset > 0) k.unshift({ ...k[0], offset: 0 });
  if (k[k.length - 1].offset < 1) k.push({ ...k[k.length - 1], offset: 1 });
  const a = target.animate(k, { duration: TD, fill: 'both' });
  ALL.push(a);
  return a;
}
// One keyframe per 60 fps frame between t0 and t1.
function sample(target, t0, t1, fn) {
  const k = [];
  for (let f = Math.ceil(t0 * FPS - 1e-9); f <= Math.floor(t1 * FPS + 1e-9); f++) k.push({ t: f / FPS, ...fn(f / FPS) });
  return anim(target, k);
}
function show(target, a, b, fadeIn = 0, fadeOut = 0) {
  return anim(target, [{ t: a, opacity: 0 }, { t: a + fadeIn, opacity: 1 }, { t: b - fadeOut, opacity: 1 }, { t: b, opacity: 0 }]);
}
function scene(bg, a, b) {
  const s = el('div', `background:${bg}`);
  s.className = 'scene';
  show(s, a, b);
  return s;
}
// Distance from an element's top to its text baseline (layout only, unaffected by transforms).
function baselineOf(e) {
  const m = el('span', 'display:inline-block;width:0;height:0;vertical-align:baseline', e);
  const y = m.offsetTop;
  m.remove();
  return y;
}
function placeText(e, x, baseline) { e.style.left = x + 'px'; e.style.top = (baseline - baselineOf(e)) + 'px'; }
function fitWidth(e, width) {
  const n = e.textContent.length;
  e.style.letterSpacing = '0px';
  e.style.letterSpacing = ((width - e.offsetWidth) / Math.max(1, n - 1)) + 'px';
}
// Text that changes at given times: a strip of lines shifted with step keyframes.
function ticker(parent, entries, lineH, css) {
  const box = el('span', `display:inline-block;height:${lineH}px;overflow:hidden;vertical-align:top;${css || ''}`, parent);
  const strip = el('span', 'display:block', box);
  for (const [, s] of entries) el('span', `display:block;height:${lineH}px;line-height:${lineH}px`, strip).textContent = s;
  anim(strip, entries.map(([t], i) => ({ t, transform: `translateY(${-lineH * i}px)`, e: 'step-end' })));
  return box;
}
const frameTime = (f) => (f === 0 ? 0 : (f - 0.5) / FPS);
const pad = (n, w) => String(n).padStart(w, '0');

const C = { dark: '#111113', red: '#E93F32', blue: '#303AF4', yellow: '#F4CA42', cream: '#E9E5DD', ink: '#141414', paper: '#ECE9E3' };
const BEAT = 60 / 128, BAR = BEAT * 4;

/* ---------------- shot 1: red dot splits 1 > 2 > 4 > 8, ring collapses (0.00 - 1.95) ---------------- */
const s1 = scene(C.dark, 0, 1.955);
const R1 = (t) => pw(t, [[0.469, 0], [0.66, 84, E.out], [0.85, 72, E.inOut], [0.9375, 72], [1.1, 102, E.out], [1.25, 98, E.inOut],
  [1.406, 98], [1.56, 172, E.out], [1.68, 200, E.inOut], [1.75, 190, E.inOut], [1.85, 0, E.in]]);
{
  const cross = el('div', 'position:absolute;left:951px;top:531px;width:18px;height:18px', s1,
    '<div style="position:absolute;left:8.5px;top:0;width:1px;height:18px;background:#38383d"></div>' +
    '<div style="position:absolute;top:8.5px;left:0;height:1px;width:18px;background:#38383d"></div>');
  show(cross, 0.55, 1.82, 0.08, 0.05);
  const ring = el('div', 'position:absolute;left:760px;top:340px;width:400px;height:400px;border-radius:50%;box-sizing:border-box;border:1.5px solid rgba(255,255,255,.12)', s1);
  sample(ring, 1.4, 1.86, (t) => ({ transform: `scale(${Math.max(0.001, R1(t) / 200)})`, opacity: pw(t, [[1.4, 0], [1.5, 1], [1.74, 1], [1.82, 0]]) }));
  const a3 = [-116, -116, -26, -26, 64, 64, 154, 154];
  for (let i = 0; i < 8; i++) {
    const dot = el('div', `position:absolute;left:940px;top:520px;width:40px;height:40px;border-radius:50%;background:${C.red}`, s1);
    const a2 = i < 4 ? -162 : 18, a4 = -113 + 45 * i;
    sample(dot, 0, 1.9, (t) => {
      let a = a2;
      if (t > 0.9375) a = lerp(a2, a3[i], E.out(clamp((t - 0.9375) / 0.16, 0, 1)));
      if (t > 1.406) a = lerp(a3[i], a4, E.out(clamp((t - 1.406) / 0.16, 0, 1)));
      if (t > 0.9375) a += 40 * (t - 0.9375);
      const s = pw(t, [[0.1, 0], [0.22, 1.35, E.out], [0.36, 1, E.inOut], [1.75, 1], [1.85, 1.8, E.in]]);
      return { transform: `rotate(${a}deg) translateX(${R1(t)}px) scale(${Math.max(0.001, s)})`, opacity: t < 1.87 ? 1 : 0 };
    });
  }
}

/* ---------------- shot 2: EVERY [FRAME] ON PURPOSE. on red (1.86 - 3.75) ---------------- */
const s2 = scene(C.red, 1.855, 3.745);
const REVEAL2 = [[1.855, 0], [1.867, 60], [1.883, 280], [1.9, 680], [1.917, 900], [1.933, 1150], [1.95, 1250]];
sample(s2, 1.85, 1.96, (t) => ({ clipPath: `circle(${pw(t, REVEAL2)}px at 960px 540px)` }));
const fx = el('div', 'position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;z-index:5;pointer-events:none');
{
  const ring = el('div', 'position:absolute;left:860px;top:440px;width:200px;height:200px;border-radius:50%;box-sizing:border-box;border:5px solid #DCD8D0', fx);
  sample(ring, 1.85, 1.96, (t) => {
    const r = pw(t, REVEAL2) * 1.12 + 14;
    return { transform: `scale(${Math.max(0.001, r / 100)})`, opacity: t > 1.866 && t < 1.95 ? 1 : 0 };
  });
}
{
  const cam = el('div', 'position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;color:#121212', s2);
  const word = (txt, size) => el('div', `position:absolute;font-size:${size}px;line-height:1.2`, cam, txt);
  const F = 203;
  const every = word('EVERY', F); every.className = 'disp'; fitWidth(every, 644); placeText(every, 256, 524);
  const frame = word('', F); frame.className = 'disp';
  const fl = [...'FRAME'].map((ch) => el('span', 'display:inline-block', frame, ch));
  fitWidth(frame, 698); placeText(frame, 968, 524);
  const on = word('ON', F); on.className = 'disp'; fitWidth(on, 288); placeText(on, 256, 700);
  const purpose = word('', F); purpose.className = 'disp';
  const pl = [...'PURPOSE'].map((ch) => el('span', 'display:inline-block', purpose, ch));
  fitWidth(purpose, 950); placeText(purpose, 604, 700);
  const period = el('div', 'position:absolute;left:1580px;top:660px;width:40px;height:40px;border-radius:50%;background:#121212', cam);
  const pdot = el('div', `position:absolute;left:17.6px;top:17.6px;width:4.8px;height:4.8px;border-radius:50%;background:${C.red}`, period);
  // corner brackets around FRAME
  const brk = el('div', 'position:absolute;left:928px;top:352px;width:772px;height:192px', cam);
  const corner = (css) => el('div', `position:absolute;width:26px;height:26px;box-sizing:border-box;${css}`, brk);
  corner('left:0;top:0;border-left:6px solid #121212;border-top:6px solid #121212');
  corner('right:0;top:0;border-right:6px solid #121212;border-top:6px solid #121212');
  corner('left:0;bottom:0;border-left:6px solid #121212;border-bottom:6px solid #121212');
  corner('right:0;bottom:0;border-right:6px solid #121212;border-bottom:6px solid #121212');

  const camK = [[1.85, 3.4, -114, -997], [1.95, 1.8, -60, -274, E.out], [2.33, 1.72, -14, -237], [2.47, 1.16, -104, -20, E.out], [2.6, 1.12, -99, 2, E.inOut],
    [2.84, 1.12, -99, 2], [2.96, 1.53, 136, -409, E.inOut], [3.28, 1.56, 128, -424], [3.49, 1, 0, 0, E.inOut], [3.55, 1, 0, 0]];
  const ZOOM = [[3.55, 1], [3.583, 1.02], [3.6, 1.06], [3.617, 1.15], [3.633, 1.33], [3.65, 1.65], [3.667, 2.3], [3.683, 3.6],
    [3.7, 6], [3.717, 11.5], [3.733, 26], [3.75, 60]];
  sample(cam, 1.85, 3.75, (t) => {
    let s, tx, ty;
    if (t <= 3.55) {
      s = pwLog(t, camK.map((k) => [k[0], k[1], k[4]]));
      tx = pw(t, camK.map((k) => [k[0], k[2], k[4]]));
      ty = pw(t, camK.map((k) => [k[0], k[3], k[4]]));
    } else {
      s = pwLog(t, ZOOM);
      const u = 1 - 1 / s;
      tx = lerp(1600, CX, u) - s * 1600;
      ty = lerp(680, CY, u) - s * 680;
    }
    const blur = pw(t, [[2.84, 0], [2.9, 7], [2.97, 0]]) + pw(t, [[3.3, 0], [3.39, 8], [3.48, 0]]);
    return { transform: `translate(${tx}px,${ty}px) scale(${s})`, filter: `blur(${blur}px)` };
  });
  fl.forEach((l, j) => {
    const st = 2.33 + 0.035 * j;
    sample(l, 2.3, 2.75, (t) => {
      const p = clamp((t - st) / 0.24, 0, 1);
      return {
        transform: `translate(${300 * (1 - E.out(p))}px,${-320 * (1 - E.outBack(p))}px) rotate(${-30 * (1 - E.out(p))}deg)`,
        opacity: clamp(p * 4, 0, 1),
      };
    });
  });
  sample(brk, 2.4, 2.62, (t) => {
    const p = E.out(clamp((t - 2.42) / 0.16, 0, 1));
    return { transform: `scale(${lerp(1.25, 1, p)})`, opacity: p };
  });
  sample(on, 2.84, 3.0, (t) => {
    const p = E.out(clamp((t - 2.86) / 0.12, 0, 1));
    return { transform: `translateY(${60 * (1 - p)}px)`, opacity: p };
  });
  pl.forEach((l, j) => {
    const st = 3.3 + 0.02 * j;
    sample(l, 3.28, 3.56, (t) => {
      const p = E.out(clamp((t - st) / 0.12, 0, 1));
      return { transform: `translateY(${80 * (1 - p)}px)`, opacity: p };
    });
  });
  sample(period, 3.44, 3.54, (t) => ({ transform: `scale(${Math.max(0.001, E.outBack(clamp((t - 3.46) / 0.07, 0, 1)))})` }));
  show(pdot, 3.58, 4);
}

/* ---------------- shot 3: shape morph inside a transform box (3.75 - 5.63) ---------------- */
const s3 = scene(C.dark, 3.745, 5.6167);
const ROT = (t) => pw(t, [[4.219, 0], [4.39, 90, E.inOut], [4.6875, 98], [4.88, 256, E.inOut], [5.156, 244], [5.3, 275, E.inOut], [5.625, 286]]);
const WHIP_BLUR = (t) => pw(t, [[4.22, 0], [4.3, 5], [4.39, 0]]) + pw(t, [[4.69, 0], [4.78, 6], [4.88, 0]]) + pw(t, [[5.156, 0], [5.23, 5], [5.3, 0]]);
// phyllotaxis flower of dots, shared with shot 4
const FL = [];
for (let n = 1; n < 2000; n++) {
  const r = 8.2 * Math.sqrt(n), th = n * 2.399963;
  if (r > 215) break;
  if (r <= 210 * (0.88 + 0.12 * Math.cos(6 * th))) FL.push([r * Math.cos(th), r * Math.sin(th)]);
}
{
  const shapes = el('div', 'position:absolute;left:0;top:0;width:1920px;height:1080px', s3);
  sample(shapes, 4.2, 5.32, (t) => ({ filter: `blur(${WHIP_BLUR(t) * 0.8}px)` }));
  const circle = el('div', `position:absolute;left:720px;top:300px;width:480px;height:480px;border-radius:50%;background:${C.red};box-shadow:0 0 0 3px rgba(120,30,30,.55)`, shapes);
  sample(circle, 3.74, 4.34, (t) => ({
    transform: `scale(${pw(t, [[3.745, 0.46], [3.9, 1, E.out], [4.22, 1], [4.33, 0.86, E.inOut]])})`,
    opacity: pw(t, [[4.27, 1], [4.33, 0]]),
  }));
  const sq = el('div', 'position:absolute;left:760px;top:340px;width:400px;height:400px;border-radius:66px;background:#343EF0', shapes);
  sample(sq, 4.26, 4.88, (t) => ({
    transform: `rotate(${ROT(t)}deg) scale(${pw(t, [[4.27, 1.12], [4.4, 1, E.out]])})`,
    opacity: pw(t, [[4.27, 0], [4.31, 1], [4.8, 1], [4.86, 0]]),
    backgroundColor: mixHex('#343EF0', '#A3A2E6', pw(t, [[4.69, 0], [4.75, 1], [4.84, 0.6]])),
  }));
  const tri = el('div', 'position:absolute;left:660px;top:240px;width:600px;height:600px', shapes,
    '<svg width="600" height="600" viewBox="0 0 600 600"><path d="M300 50 L516.5 425 L83.5 425 Z" fill="#F2C33F" stroke="#F2C33F" stroke-width="70" stroke-linejoin="round"/></svg>');
  sample(tri, 4.7, 5.27, (t) => ({
    transform: `rotate(${ROT(t)}deg) scale(${pw(t, [[4.8, 0.9], [4.92, 1, E.out]])})`,
    opacity: pw(t, [[4.8, 0], [4.86, 1], [5.19, 1], [5.25, 0]]),
  }));
  let fp = '';
  for (let i = 0; i <= 360; i++) {
    const th = (i / 360) * Math.PI * 2, r = 175 + 28 * Math.cos(6 * th);
    fp += (i ? 'L' : 'M') + (300 + r * Math.cos(th)).toFixed(1) + ' ' + (300 + r * Math.sin(th)).toFixed(1);
  }
  const flower = el('div', 'position:absolute;left:660px;top:240px;width:600px;height:600px', shapes,
    `<svg width="600" height="600" viewBox="0 0 600 600"><path d="${fp}Z" fill="#EE5F3B"/></svg>`);
  sample(flower, 5.18, 5.45, (t) => ({
    transform: `rotate(${ROT(t)}deg) scale(${pw(t, [[5.19, 0.9], [5.3, 1, E.out]])})`,
    opacity: pw(t, [[5.19, 0], [5.24, 1], [5.38, 1], [5.44, 0]]),
  }));
  const dots = FL.map(([x, y]) => `<circle cx="${(300 + x).toFixed(1)}" cy="${(300 + y).toFixed(1)}" r="6"/>`).join('');
  const dflower = el('div', 'position:absolute;left:660px;top:240px;width:600px;height:600px', shapes,
    `<svg width="600" height="600" viewBox="0 0 600 600"><g fill="${C.red}">${dots}</g></svg>`);
  sample(dflower, 5.36, 5.63, (t) => ({
    transform: `rotate(${ROT(t)}deg) scale(${pw(t, [[5.38, 1.06], [5.5, 1, E.out]])})`,
    opacity: pw(t, [[5.38, 0], [5.44, 1]]),
  }));

  // transform box with handles
  const hs = [[0, 0], [309, 0], [618, 0], [618, 309], [618, 618], [309, 618], [0, 618], [0, 309]]
    .map(([x, y]) => `<rect x="${x + 41}" y="${y + 41}" width="12" height="12" fill="${C.dark}" stroke="#E8E8E8" stroke-width="1.5"/>`).join('');
  const box = el('div', 'position:absolute;left:613px;top:193px;width:700px;height:700px', s3,
    `<svg width="700" height="700" viewBox="0 0 700 700"><rect class="edge" x="41" y="41" width="618" height="618" fill="none" stroke="#B9B9BD" stroke-width="1.6" stroke-dasharray="2472 2472"/><g class="hd">${hs}</g></svg>`);
  box.querySelectorAll('rect.edge, g.hd rect').forEach((r) => r.setAttribute('transform', 'translate(-6,-6)'));
  box.querySelector('rect.edge').setAttribute('transform', '');
  const edge = box.querySelector('rect.edge'), handles = box.querySelector('g.hd');
  sample(edge, 3.76, 4.05, (t) => ({ strokeDashoffset: `${2472 * (1 - E.out(clamp((t - 3.78) / 0.24, 0, 1)))}px` }));
  sample(handles, 3.96, 4.08, (t) => ({ opacity: clamp((t - 3.98) / 0.07, 0, 1) }));
  sample(box, 3.75, 5.45, (t) => ({
    transform: `rotate(${ROT(t)}deg) scale(${pw(t, [[4.22, 1], [4.38, 0.9, E.out]])})`,
    opacity: pw(t, [[5.33, 1], [5.41, 0]]),
    filter: `blur(${WHIP_BLUR(t) * 0.6}px)`,
  }));
  const cross = el('div', 'position:absolute;left:946px;top:526px;width:28px;height:28px', s3,
    '<svg width="28" height="28"><circle cx="14" cy="14" r="7" fill="none" stroke="#F6C9C2" stroke-width="1.3"/><path d="M14 0V28M0 14H28" stroke="#F6C9C2" stroke-width="1.3"/></svg>');
  show(cross, 3.85, 5.38, 0.06, 0.04);
  const label = el('div', 'position:absolute;left:1290px;top:192px;font-size:19px;letter-spacing:.08em;color:#ECE9E3', s3);
  label.className = 'din';
  const rot = [];
  for (let f = 224; f <= 330; f++) rot.push([frameTime(f), 'ROT ' + pad((ROT(f / FPS) % 360).toFixed(1), 5) + '°']);
  ticker(label, rot, 26);
  el('br', '', label);
  ticker(label, [[0, 'SHAPE CIRCLE'], [4.219, 'SHAPE SQUARE'], [4.69, 'SHAPE TRIANGLE'], [5.05, 'SHAPE FLOWER']], 26, 'opacity:.55');
  show(label, 3.85, 5.42, 0.08, 0.08);
}

/* ---------------- shots 4 and 5: dot grid on cream, then particles on blue (5.63 - 9.38) ---------------- */
const GX = 32, GY = 18, NG = GX * GY, FOCAL = 1500;
const grid = [];
for (let j = 0; j < GY; j++) for (let i = 0; i < GX; i++) grid.push({ i, j, x: 66 + 58 * i, y: 44 + 58.4 * j });
{
  const rot0 = (ROT(5.625) * Math.PI) / 180;
  const order = grid.map((g, k) => k).sort((a, b) => Math.hypot(grid[a].x - CX, grid[a].y - CY) - Math.hypot(grid[b].x - CX, grid[b].y - CY));
  order.forEach((k, rank) => {
    const [x, y] = FL[Math.min(rank, FL.length - 1)];
    grid[k].rank = rank;
    grid[k].hasF = rank < FL.length;
    grid[k].fx = CX + x * Math.cos(rot0) - y * Math.sin(rot0);
    grid[k].fy = CY + x * Math.sin(rot0) + y * Math.cos(rot0);
  });
}
function segDist(px, py, pts) {
  let best = 1e9;
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1];

    [13.233, 1008, 420, 40, 52], [13.267, 1032, 372, 40, 50], [13.283, 1048, 348, 40, 48], [13.35, 1096, 304, 44, 40], [13.42, 1150, 300, 40, 40],
    [13.483, 1208, 352, 30, 34], [13.55, 1280, 500, 36, 40], [13.6, 1302, 568, 40, 40]];
  sample(dot, 13.11, 13.62, (t) => {
    const v = (c) => pw(t, DP.map((d) => [d[0], d[c]]));
    return { transform: `translate(${v(1)}px,${v(2)}px) scale(${v(3) / 100},${v(4) / 100})` };
  });
}

/* ---------------- HUD (frame counter, timecode, bar and beat) ---------------- */
{
  const hud = el('div', `position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:10;color:${C.paper}`);
  hud.className = 'din';
  sample(hud, 0.09, 0.25, (t) => ({ opacity: pw(t, [[0.1, 0], [0.24, 1]]) }));
  anim(hud, [[0, C.paper], [1.915, C.ink], [3.745, C.paper], [5.6167, C.ink], [7.4917, C.paper], [9.375, C.ink], [11.2417, C.paper], [13.2, C.ink]]
    .map(([t, c]) => ({ t, color: c, e: 'step-end' })));
  const br = (x, y, w, h) => el('div', `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:currentColor;opacity:.55`, hud);
  br(56, 56, 30, 2); br(56, 56, 2, 30); br(1834, 56, 30, 2); br(1862, 56, 2, 30);
  br(56, 1022, 30, 2); br(56, 994, 2, 30); br(1834, 1022, 30, 2); br(1862, 994, 2, 30);
  const text = 'position:absolute;font-size:17px;line-height:20px;letter-spacing:.2em;white-space:pre';
  const tl = el('div', `${text};left:87px;top:72px`, hud, 'CLAUDE<span style="opacity:.5;margin-left:1.05em">MOTION REEL 2026</span>');
  const tr = el('div', `${text};right:84px;top:72px`, hud);
  const sqs = el('span', 'display:inline-block;height:20px;vertical-align:top;margin-right:.9em', tr);
  for (let i = 0; i < 4; i++) {
    const sq = el('span', 'display:inline-block;position:relative;width:8px;height:8px;margin:6px 8px 0 0;vertical-align:top', sqs);
    el('span', 'position:absolute;left:0;top:0;width:8px;height:8px;box-sizing:border-box;border:1.5px solid currentColor;opacity:.5', sq);
    const fill = el('span', 'position:absolute;left:-1.5px;top:-1.5px;width:11px;height:11px;background:currentColor', sq);
    const k = [];
    for (let b = 0; b <= 33; b++) k.push({ t: Math.max(0, b * BEAT - 0.001), opacity: b % 4 === i ? 1 : 0, e: 'step-end' });
    anim(fill, k);
  }
  ticker(tr, Array.from({ length: 8 }, (_, b) => [Math.max(0, b * BAR - 0.001), `BAR ${b + 1}/8`]), 20, 'opacity:.5;margin-right:.9em');
  el('span', '', tr, '128 BPM');
  const brt = el('div', `${text};right:84px;top:983px`, hud);
  const tcF = [], tcT = [];
  for (let f = 0; f <= 912; f++) {
    tcF.push([frameTime(f), 'F' + pad(f + 1, 4)]);
    tcT.push([frameTime(f), `00:00:${pad(Math.floor(f / 60), 2)}:${pad(f % 60, 2)}`]);
  }
  const fcount = ticker(brt, tcF, 20, 'opacity:.5;margin-right:1.2em');
  ticker(brt, tcT, 20);
  [tl, tr, fcount].forEach((e) => sample(e, 13.14, 13.28, (t) => ({ opacity: pw(t, [[13.15, e === fcount ? 0.5 : 1], [13.27, 0]]) })));
}

/* All animations share one start time: page time 0 is clip time 0. */
const t0 = document.timeline.currentTime || 0;
for (const a of ALL) a.startTime = t0;
if (location.hash.startsWith('#t=')) {
  const ms = parseFloat(location.hash.slice(3)) * 1000;
  for (const a of ALL) { a.pause(); a.currentTime = ms; }
}
</script>
